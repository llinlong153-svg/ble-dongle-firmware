# 满血版 nRF52840 Dongle (PCA10059) USB CDC ACM HCI_UART 固件配置
# 开启 2M PHY、251 字节最大 DLE 数据长度扩展、8 路并发连接与大容量 ACL 缓冲区
CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_HCI_RAW_H4=y
CONFIG_BT_HCI_RAW_H4_ENABLE=y
CONFIG_BT_HCI_RAW_CMD_EXT=y

# 并发连接数上限 (支持单 Dongle 同时挂载最多 8 台设备)
CONFIG_BT_MAX_CONN=8

# 开启 LE 2M PHY 与 DLE 251 字节最大空口包长 (彻底突破 27 字节拆包瓶颈)
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_PHY_UPDATE=y

# 扩大控制器 HCI ACL 收发缓冲区数量与尺寸，防止多设备并发高速写入时阻塞
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_RX_BUFFERS=16

# 启用高级发射功率动态控制 (可选 +8dBm 增强信号覆盖)
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_CONN_RSSI=y
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# USB CDC ACM 虚拟串口高速传输配置
CONFIG_SERIAL=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Zephyr HCI UART HighSpeed"
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096
